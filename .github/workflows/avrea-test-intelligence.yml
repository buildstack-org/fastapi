name: Avrea Test Intelligence

# Demo branch for the coverage trend on dev-varjo: measures the fastapi
# package only and writes a coverage report, no test report. Each dispatch
# can skip a few test files so coverage moves slightly. Manual only.
on:
  workflow_dispatch:
    inputs:
      skip:
        description: Test files to skip, separated by spaces
        required: false
        default: ""

permissions:
  contents: read

env:
  UV_NO_SYNC: true
  INLINE_SNAPSHOT_DEFAULT_FLAGS: review

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ["3.14"]
    runs-on: buildstack-dev-varjo
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Dependencies
        run: uv sync --no-dev --group tests --extra all
      # FastAPI's coverage settings write their data under coverage/.
      - run: mkdir -p coverage
      - name: Test
        env:
          SKIP: ${{ inputs.skip }}
        run: |
          args=()
          for path in $SKIP; do args+=("--ignore=$path"); done
          uv run --no-sync bash scripts/test.sh --cov=fastapi --cov-context=test \
            --cov-report=xml "${args[@]}"
